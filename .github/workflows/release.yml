name: Build, Test & Release Kryvnix Antivirus

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore KryvnixAntivirus.slnx

      - name: Build Release
        run: dotnet build KryvnixAntivirus.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test desktop/KryvnixAntivirus.Tests/KryvnixAntivirus.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish Standalone Windows x64 Executable
        run: >
          dotnet publish desktop/KryvnixAntivirus.Desktop/KryvnixAntivirus.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath KryvnixAntivirus-win-x64.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryvnixAntivirus-win-x64
          path: |
            publish/win-x64/KryvnixAntivirus.exe
            KryvnixAntivirus-win-x64.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/win-x64/KryvnixAntivirus.exe
            KryvnixAntivirus-win-x64.zip
